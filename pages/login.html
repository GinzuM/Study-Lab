<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Study Lab</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div class="login-container">
        <h2>Entrar no Study Lab</h2>
        <form id="login-form">
            <div class="input-group">
                <label for="email">E-mail</label>
                <input type="email" id="email" required placeholder="Seu e-mail">
            </div>
            <div class="input-group">
                <label for="password">Senha</label>
                <input type="password" id="password" required placeholder="Sua senha">
            </div>
            <button type="submit" id="login-button">Entrar</button>
            <p id="error-message" style="color: red; margin-top: 10px; display: none;"></p>
        </form>
    </div>

    <script type="module">
        import { supabase } from '../js/auth.js'

        const form = document.getElementById('login-form')
        const emailInput = document.getElementById('email')
        const passwordInput = document.getElementById('password')
        const errorMsg = document.getElementById('error-message')

        // Se já estiver logado, redireciona direto para a home (raiz)
        supabase.auth.getSession().then(({ data: { session } }) => {
            if (session) {
                window.location.href = '/'
            }
        })

        form.addEventListener('submit', async (e) => {
            e.preventDefault()
            errorMsg.style.display = 'none'

            const email = emailInput.value
            const password = passwordInput.value

            const { data, error } = await supabase.auth.signInWithPassword({
                email,
                password
            })

            if (error) {
                errorMsg.textContent = error.message
                errorMsg.style.display = 'block'
            } else {
                // Login com sucesso, redireciona para a raiz (index.html)
                window.location.href = '/'
            }
        })
    </script>
</body>
</html>
