<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Doc's Lab</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='54' r='44' fill='%231e1b4b' stroke='%23090d16' stroke-width='3'/%3E%3Cpath d='M 16 74 C 12 56, 24 46, 50 46 C 76 46, 86 58, 82 76 C 78 88, 66 93, 50 93 C 30 93, 19 86, 16 74 Z' fill='%23141419' stroke='%23090d16' stroke-width='3'/%3E%3Cpath d='M 25 38 C 25 22, 72 22, 72 40 C 72 51, 59 56, 46 55 C 36 55, 29 59, 25 65 C 23 56, 26 48, 25 38 Z' fill='%23f8fafc' stroke='%23090d16' stroke-width='3'/%3E%3Ccircle cx='33' cy='40' r='7.5' fill='%23090d16'/%3E%3Ccircle cx='57' cy='40' r='8' fill='%23090d16'/%3E%3C/svg%3E">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../css/main.css">
</head>
<body class="min-h-screen flex items-center justify-center p-4 bg-slate-950">

  <div class="max-w-md w-full duo-card p-6 sm:p-8 space-y-6 border-2 border-slate-700 bg-slate-900/90 shadow-2xl">
    <!-- Mascote Único: Doc -->
    <div class="flex flex-col items-center text-center space-y-3">
      <div class="w-28 h-28 rounded-3xl bg-slate-950 border-2 border-emerald-400 p-1.5 shadow-xl anim-breathe overflow-hidden">
        <img src="../assets/doc_mascot.jpeg" alt="Doc Mascot" class="w-full h-full object-cover rounded-2xl" onerror="if(!this.dataset.triedJpg){this.dataset.triedJpg='1';this.src='../assets/doc_mascot.jpg';}else{this.style.display='none';}">
      </div>

      <div>
        <span class="text-[10px] font-extrabold uppercase tracking-widest bg-emerald-500/20 text-emerald-400 px-3 py-1 rounded-full border border-emerald-500/30">
          Plataforma Gamificada
        </span>
        <h1 class="text-3xl font-bold text-white mt-2">Doc's Lab</h1>
        <p class="text-xs opacity-75 mt-1">Entre na sua conta para sincronizar o seu personagem, XP, Moedas e Insígnias na nuvem.</p>
      </div>
    </div>

    <div id="auth-feedback" class="hidden p-3.5 rounded-2xl border text-xs font-bold text-center"></div>

    <!-- Formulário de Login (Com bloqueio nativo de reload '?') -->
    <form id="form-login" onsubmit="return window.handleLoginSubmit(event)" class="space-y-4">
      <div class="space-y-1">
        <label class="text-xs font-extrabold uppercase opacity-75">Seu E-mail</label>
        <input type="email" id="login-email" required placeholder="seuemail@exemplo.com"
               class="w-full p-3.5 rounded-2xl bg-slate-950 border-2 border-slate-700 text-sm font-bold text-white focus:outline-none focus:border-emerald-400">
      </div>
      <div class="space-y-1">
        <label class="text-xs font-extrabold uppercase opacity-75">Sua Senha</label>
        <input type="password" id="login-password" required placeholder="••••••••"
               class="w-full p-3.5 rounded-2xl bg-slate-950 border-2 border-slate-700 text-sm font-bold text-white focus:outline-none focus:border-emerald-400">
      </div>
      <button type="submit" id="btn-submit-login" class="w-full btn-3d btn-green py-3.5 text-sm uppercase tracking-wider">
        Entrar no Laboratório
      </button>
    </form>

    <!-- Formulário de Registo -->
    <form id="form-register" onsubmit="return window.handleRegisterSubmit(event)" class="hidden space-y-4">
      <div class="space-y-1">
        <label class="text-xs font-extrabold uppercase opacity-75">E-mail para Cadastro</label>
        <input type="email" id="register-email" required placeholder="seuemail@exemplo.com"
               class="w-full p-3.5 rounded-2xl bg-slate-950 border-2 border-slate-700 text-sm font-bold text-white focus:outline-none focus:border-purple-400">
      </div>
      <div class="space-y-1">
        <label class="text-xs font-extrabold uppercase opacity-75">Criar Senha (mín. 6 caracteres)</label>
        <input type="password" id="register-password" required minlength="6" placeholder="••••••••"
               class="w-full p-3.5 rounded-2xl bg-slate-950 border-2 border-slate-700 text-sm font-bold text-white focus:outline-none focus:border-purple-400">
      </div>
      <button type="submit" id="btn-submit-register" class="w-full btn-3d btn-purple py-3.5 text-sm uppercase tracking-wider">
        Criar Conta Gratuita
      </button>
    </form>

    <div class="pt-3 border-t border-slate-800 text-center">
      <button id="toggle-auth-mode" type="button" onclick="window.toggleAuthMode()" class="text-xs font-extrabold text-emerald-400 hover:underline">
        Não tem uma conta? Cadastre-se gratuitamente
      </button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/auth.js"></script>
</body>
</html>
