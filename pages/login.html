<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Study Lab</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div class="login-container">
        <h2>Entrar no Study Lab</h2>
        <form id="login-form">
            <div class="input-group">
                <label for="email">E-mail</label>
                <input type="email" id="email" required placeholder="Seu e-mail">
            </div>
            <div class="input-group">
                <label for="password">Senha</label>
                <input type="password" id="password" required placeholder="Sua senha">
            </div>
            <button type="submit" id="login-button">Entrar</button>
            <p id="error-message" style="color: red; margin-top: 10px; display: none;"></p>
        </form>
    </div>

    <!-- 1. Carrega o SDK do Supabase global -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- 2. Script de login síncrono padrão -->
    <script>
        const SUPABASE_URL = 'https://sqhymzvkfqudmridwmop.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_flOOhNjr0YJ8es0EtyLG5w_csXqh0n_';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // Se já estiver logado, joga pra home direto
        supabaseClient.auth.getSession().then(({ data: { session } }) => {
            if (session) {
                window.location.replace('/');
            }
        });

        const form = document.getElementById('login-form');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const errorMsg = document.getElementById('error-message');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorMsg.style.display = 'none';

            const { data, error } = await supabaseClient.auth.signInWithPassword({
                email: emailInput.value,
                password: passwordInput.value
            });

            if (error) {
                errorMsg.textContent = error.message;
                errorMsg.style.display = 'block';
            } else {
                // Sucesso: Redireciona para a raiz
                window.location.replace('/');
            }
        });
    </script>
</body>
</html>
